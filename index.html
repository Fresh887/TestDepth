<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Depth</title>
<style>
:root{--bg:#0d1020;--deep:#08203a;--hud:#f59e1b;--red:#c8312f;--ink:#c9d6e6;--dim:#6f7f96;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
.screen{display:none;min-height:100%;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;position:relative}
.screen.on{display:flex;animation:fade 1.2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.brk{position:fixed;width:34px;height:34px;border:3px solid var(--hud);pointer-events:none;opacity:.85}
.brk.a{top:calc(16px + env(safe-area-inset-top,0px));left:16px;border-right:0;border-bottom:0}
.brk.b{top:calc(16px + env(safe-area-inset-top,0px));right:16px;border-left:0;border-bottom:0}
.brk.c{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;border-right:0;border-top:0}
.brk.d{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;border-left:0;border-top:0}
form{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px}
input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hud);color:#ffd9a0;font:1.4rem "Courier New",monospace;letter-spacing:.2em;text-align:center;padding:10px 4px;outline:none}
input:focus-visible{border-bottom-width:2px;box-shadow:0 8px 18px -12px var(--hud)}
input::placeholder{color:#4a5870;letter-spacing:.1em}
.fb{min-height:1.5em;font-style:italic;color:var(--red);margin:0;text-align:center}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pulse{width:84px;height:84px;border:1px dashed var(--hud);border-radius:50%;margin-bottom:28px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.45}}
.lead{font-style:italic;color:var(--dim);margin:0 0 6px}
.wrap{position:relative;width:100%;max-width:960px;aspect-ratio:1018/658;border:1px solid #1b2a44;background:#050a14}
.wrap canvas{width:100%;height:100%;display:block}
#plate{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 2s;pointer-events:none;padding:12px}
#plate.on{opacity:1}
#plate p{margin:0;font:clamp(1.2rem,4.6vw,2.8rem) "Courier New",monospace;letter-spacing:.28em;color:#ffd9a0;text-shadow:0 0 18px rgba(245,158,27,.75);text-align:center;word-spacing:.5em}
.panel{width:100%;max-width:620px;margin-top:22px;text-align:center}
#txt{font-size:1.15rem;line-height:1.7;margin:0 0 20px;transition:opacity 1s}
#txt p{margin:0 0 .8em}
#s4{background:radial-gradient(circle at 50% 50%,#0a2a4a 0,#050d1a 60%,#02050b 100%);overflow:hidden}
.sweep{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;background:conic-gradient(from 0deg,rgba(245,158,27,0) 0 300deg,rgba(245,158,27,.26) 360deg);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.r{position:absolute;left:50%;top:50%;width:20vmin;height:20vmin;margin:-10vmin 0 0 -10vmin;border:1px solid rgba(245,158,27,.6);border-radius:50%;opacity:0;animation:ping 4.5s ease-out infinite}
.r:nth-of-type(2){animation-delay:1.5s}.r:nth-of-type(3){animation-delay:3s}
@keyframes ping{0%{transform:scale(.2);opacity:.9}100%{transform:scale(8);opacity:0}}
.bub{position:absolute;bottom:-20px;border:1px solid rgba(140,190,230,.5);border-radius:50%;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(18px)}}
#word{position:relative;margin:0;font:italic clamp(3.4rem,15vw,10rem) Georgia,serif;letter-spacing:.1em;white-space:nowrap}
#word span{display:inline-block;color:#4d6a8c;transition:color 1s,text-shadow 1.4s}
#word span.lock{color:#ffe9c4;text-shadow:0 0 28px rgba(245,158,27,.9),0 0 70px rgba(245,158,27,.5)}
#reset{position:absolute;z-index:2;bottom:calc(44px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:transparent;border:1px solid var(--hud);color:#ffd9a0;font:1rem Georgia,serif;font-style:italic;padding:10px 22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.6s,background .3s}
#reset.on{opacity:.85;pointer-events:auto}
#reset:hover,#reset:focus-visible{background:rgba(245,158,27,.18);outline:none}
.title{margin:0 0 18px;font:italic clamp(2.2rem,8vw,4rem) Georgia,serif;letter-spacing:.14em;color:#ffe9c4;text-shadow:0 0 24px rgba(245,158,27,.45);text-align:center}
.screen{z-index:1}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
#hud,#snd{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));z-index:60;font:.78rem 'Courier New',monospace;letter-spacing:.15em;color:var(--hud);opacity:.85}
#hud{left:64px}
#snd{right:64px;background:transparent;border:0;cursor:pointer;padding:0}
#flash{position:fixed;inset:0;background:#c8312f;opacity:0;pointer-events:none;z-index:45}
#word span.lock{animation:glitch 5s 2s infinite}
@keyframes glitch{0%,91%,100%{transform:none}93%{transform:translate(4px,-2px) skewX(8deg);text-shadow:-5px 0 #f33,5px 0 #3cf}96%{transform:translate(-4px,2px);text-shadow:5px 0 #f33,-5px 0 #3cf}}
@media (prefers-reduced-motion:reduce){.sweep,.r,.bub,.pulse{animation:none}}
</style>
</head>
<body>
<i class="brk a"></i><i class="brk b"></i><i class="brk c"></i><i class="brk d"></i>
<canvas id="snow"></canvas><div id="hud">DEPTH 0000 FT</div><button id="snd" type="button">sound: on</button><div id="flash"></div>

<section class="screen" id="s1">
  <div class="pulse"></div>
  <form id="f1" autocomplete="off">
    <h1 class="title">Test Depth</h1>
    <p class="lead">Enter the code.</p>
    <input id="i1" aria-label="Code" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="fb" id="fb1" role="status"></p>
  </form>
</section>

<section class="screen" id="s2">
  <div class="wrap"><canvas id="cv" width="1018" height="658" aria-label="A submarine beneath the waterline"></canvas>
    <div id="plate"><p id="cipher"></p></div></div>
  <div class="panel">
    <div id="txt"></div>
    <form id="f2" autocomplete="off">
      <input id="i2" aria-label="Answer" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="fb" id="fb2" role="status"></p>
    </form>
  </div>
</section>

<section class="screen" id="s4">
  <div class="sweep"></div><i class="r"></i><i class="r"></i><i class="r"></i>
  <div id="bubs"></div>
  <h1 id="word" aria-label="Mercy"></h1>
  <button id="reset" type="button">Reset puzzle</button>
</section>

/* ---------- sound, depth, ambience ---------- */
let AC=null,mute=false;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,f2){const a=ac();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.12,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start();o.stop(n+d)}
function ping(){tone(1400,2.4,'sine',.12);setTimeout(()=>tone(1400,1.6,'sine',.04),280)}
function buzz(){tone(120,.4,'square',.07,60)}
function chord(){[110,165,220,330].forEach((f,i)=>setTimeout(()=>tone(f,6,'sine',.07),i*400))}
function boom(){const a=ac();if(!a||mute)return;const n=a.sampleRate*1.8|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=700;g.gain.value=.9;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start();tone(90,1.8,'sawtooth',.3,28)}
function flash(c){const f=$('flash');f.style.background=c||'#c8312f';f.animate([{opacity:.55},{opacity:0}],{duration:800})}
let dep=0;
function setDepth(t,ms){const s=dep,t0=performance.now();(function f(n){const u=Math.min(1,(n-t0)/Math.max(ms,1));dep=s+(t-s)*(1-Math.pow(1-u,2));$('hud').textContent='DEPTH '+String(Math.round(dep)).padStart(4,'0')+' FT';if(u<1)requestAnimationFrame(f)})(t0)}
$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'sound: off':'sound: on'};
const sc=$('snow'),sx=sc.getContext('2d');
function rs(){sc.width=innerWidth;sc.height=innerHeight}rs();addEventListener('resize',rs);
const SP=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.6,v:.00004+Math.random()*.00012}));
(function f(){sx.clearRect(0,0,sc.width,sc.height);if(!reduced)for(const p of SP){p.y-=p.v*16;if(p.y<0)p.y=1;sx.fillStyle='rgba(170,200,230,'+(.15+p.r*.15)+')';sx.beginPath();sx.arc(p.x*sc.width+Math.sin(p.y*9+p.x*20)*6,p.y*sc.height,p.r,0,6.283);sx.fill()}requestAnimationFrame(f)})();
const sparks=Array.from({length:70},()=>({a:Math.random()*6.283,v:.15+Math.random()*.7,l:600+Math.random()*1400,d:Math.random()*120}));

/* ---------- canvas scene ---------- */
const cv=$('cv'),ctx=cv.getContext('2d'),W=1018,H=658,IX=520,IY=450;
const img=new Image();let ready=false,lastT=0;
img.onload=()=>{ready=true;draw(lastT)};img.src=IMG;
const shards=Array.from({length:7},(_,k)=>{const n=5+(Math.random()*3|0),pts=[];
  for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.5,r=.5+Math.random()*.6;pts.push([Math.cos(a)*r,Math.sin(a)*r])}
  const P=[[.14,.22],[.5,.14],[.86,.22],[.13,.56],[.87,.56],[.27,.86],[.73,.86]][k];return{pts,ex:W*P[0],ey:H*P[1],delay:Math.random()*400,dur:2600+Math.random()*1500,r0:Math.random()*6,spin:(Math.random()-.5)*10,fs:.7+Math.random()*.5}});
function draw(t){
  lastT=t;if(!ready)return;
  const T=t-1300;
  ctx.save();ctx.clearRect(0,0,W,H);
  if(T>0&&T<700){const k=14*(1-T/700);ctx.translate((Math.random()-.5)*k,(Math.random()-.5)*k)}
  ctx.drawImage(img,0,0,W,H);
  if(T>0){ctx.fillStyle='rgba(2,6,14,'+Math.min(.72,T/1800*.72)+')';ctx.fillRect(-20,-20,W+40,H+40)}
  if(t>0&&T<=0){
    const q=Math.pow(t/1300,2),hx=-40+(IX+40)*q,hy=-40+(IY+40)*q,a=Math.atan2(IY+40,IX+40);
    const tx=hx-Math.cos(a)*230,ty=hy-Math.sin(a)*230,g=ctx.createLinearGradient(tx,ty,hx,hy);
    g.addColorStop(0,'rgba(245,158,27,0)');g.addColorStop(1,'rgba(255,225,160,.95)');
    ctx.strokeStyle=g;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,6,0,6.283);ctx.fill();
  }
  if(T>0){
    let g=ctx.createRadialGradient(IX,IY,0,IX,IY,150);g.addColorStop(0,'rgba(245,110,20,.4)');g.addColorStop(1,'rgba(245,110,20,0)');
    ctx.fillStyle=g;ctx.fillRect(IX-150,IY-150,300,300);
    if(T<600){const al=1-T/600,r=60+T*1.4;g=ctx.createRadialGradient(IX,IY,0,IX,IY,r);
      g.addColorStop(0,'rgba(255,245,215,'+al+')');g.addColorStop(1,'rgba(245,120,20,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    const ra=Math.max(0,1-T/1400);
    if(ra>0){ctx.strokeStyle='rgba(245,158,27,'+ra+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(IX,IY,T*.9,0,6.283);ctx.stroke()}
    for(const k of sparks){const d=T-k.d;if(d<=0||d>k.l)continue;const u=d/k.l,x=IX+Math.cos(k.a)*k.v*d*(1-u*.5),y=IY+Math.sin(k.a)*k.v*d*(1-u*.5)+u*u*60;ctx.fillStyle='rgba(255,'+(200-u*120|0)+',60,'+(1-u)+')';ctx.fillRect(x,y,3,3)}
    for(let i=0;i<16;i++){const u=T-i*90;if(u<0)continue;const bx=IX-240+i*32+Math.sin(u/300+i)*8,by=IY+30-u*(.05+i%4*.02);if(by<290)continue;ctx.strokeStyle='rgba(140,190,230,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,2+i%4*1.5,0,6.283);ctx.stroke()}
    for(const s of shards){
      const tt=Math.min(1,Math.max(0,(T-s.delay)/s.dur));if(tt<=0)continue;
      const e=1-Math.pow(1-tt,3),x=IX+(s.ex-IX)*e,y=IY+(s.ey-IY)*e,r=4+(90*s.fs-4)*e,rot=s.r0+s.spin*e;
      ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(r,r);
      ctx.shadowColor='rgba(245,120,20,.9)';ctx.shadowBlur=26*(1-e)+4;
      ctx.beginPath();s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
      ctx.fillStyle='rgba(8,12,22,.96)';ctx.fill();
      ctx.lineWidth=2/r;ctx.strokeStyle='rgba(245,158,27,.75)';ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}
function playHit(done){
  if(reduced){draw(99999);done();return}
  tone(2200,1.25,'sawtooth',.035,260);setTimeout(()=>{boom();flash()},1300);setTimeout(()=>setDepth(8400,4200),1300);
  const t0=performance.now();
  (function f(now){const t=now-t0;draw(t);if(t<6000)requestAnimationFrame(f);else{draw(99999);done()}})(t0);
}

/* ---------- panels ---------- */
const RIDDLE='<p>Six eyes keep watch beneath the line. Five still burn. One went dark, and the rest followed it down.</p><p>What she was called is not what the papers wrote. Say it the way the hull said it, and she may stop falling.</p>';
const HINT='<p>Of all that rushed at you, some stayed.<br>Tally them. Return by that measure.</p>';
function setPanel(){
  const i=$('i2');$('fb2').textContent='';i.value='';
  if(stage===2){$('txt').innerHTML=RIDDLE;i.placeholder='her name'}
  else{$('txt').innerHTML=HINT;i.placeholder='the answer'}
  $('txt').style.opacity=1;i.disabled=false;
}
function showPuzzle(){
  show('s2');
  if(stage>=3){$('cipher').textContent=CIPHER;draw(99999);$('plate').classList.add('on')}
  else draw(0);
  setPanel();
}

/* ---------- finale ---------- */
function finale(skip){
  show('s4');
  const b=$('bubs');if(!b.children.length)for(let i=0;i<26;i++){const s=document.createElement('i'),z=3+Math.random()*9;s.className='bub';
    s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${6+Math.random()*7}s;animation-delay:${-Math.random()*10}s`;b.appendChild(s)}
  const rb=$('reset');rb.classList.remove('on');rb.textContent='Reset puzzle';clearTimeout(rb._t);rb._t=setTimeout(()=>rb.classList.add('on'),skip?0:5200);
  const w=$('word');w.innerHTML='';
  const L=[...'MERCY'].map(c=>{const s=document.createElement('span');s.textContent=skip?c:'#';w.appendChild(s);return s});
  if(skip){L.forEach(s=>s.classList.add('lock'));return}
  chord();flash('#fff');setDepth(0,7000);
  const chars='#%/<>01ABCDEF',t0=performance.now();
  const iv=setInterval(()=>{const t=performance.now()-t0;let all=true;
    L.forEach((s,i)=>{if(t>1400+i*600){if(!s.classList.contains('lock')){s.textContent='MERCY'[i];s.classList.add('lock');tone(520+i*110,1.4,'sine',.09)}}
      else{all=false;s.textContent=chars[Math.random()*chars.length|0]}});
    if(all)clearInterval(iv)},50);
}

/* ---------- handlers ---------- */
$('f1').addEventListener('submit',e=>{e.preventDefault();
  if(ok($('i1'),A1)){stage=2;save();ping();setDepth(1200,2500);showPuzzle()}else wrong($('i1'),$('fb1'),'Access denied.')});
$('f2').addEventListener('submit',e=>{e.preventDefault();
  const i=$('i2'),fb=$('fb2');
  if(stage===2){
    if(!ok(i,A2))return wrong(i,fb,'The water gives nothing back.');
    stage=3;save();i.disabled=true;fb.textContent='';$('txt').style.opacity=0;
    playHit(()=>{$('cipher').textContent=CIPHER;$('plate').classList.add('on');ping();setPanel()});
  }else if(stage===3){
    if(!ok(i,A3))return wrong(i,fb,'The deep keeps its own count.');
    stage=4;save();finale(false);
  }
});

let armed=0;
$('reset').addEventListener('click',()=>{const b=$('reset');
  if(!armed){armed=1;b.textContent='Erase all progress? Click again.';setTimeout(()=>{if(armed){armed=0;b.textContent='Reset puzzle'}},4000);return}
  armed=0;stage=1;save();$('plate').classList.remove('on');$('i1').value='';$('fb1').textContent='';$('i2').value='';draw(0);show('s1');
});

setDepth([0,300,1200,8400,0][stage]||0,1);
if(stage===1)show('s1');else if(stage>=4)finale(true);else showPuzzle();
</script>
